<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Logger</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎮 Game Logger</h1>
    <nav class="topnav">
      <a href="./lineup.html">Lineup</a>
      <a href="./reports.html">Reports</a>
      <a href="./index.html">Home</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="gameTitle"></h2>

      <div class="now-batting">
        <div class="label">Now Batting</div>
        <div id="batterName" class="batter"></div>
        <div id="batterSpot" class="muted"></div>
      </div>

      <div class="grid">
        <div class="block">
          <h3>Result</h3>
          <div class="btn-grid">
            <button class="big" data-res="1B">1B</button>
            <button class="big" data-res="2B">2B</button>
            <button class="big" data-res="3B">3B</button>
            <button class="big" data-res="HR">HR</button>
            <button class="big" data-res="BB">BB</button>
            <button class="big" data-res="K">K</button>
            <button class="big" data-res="OUT">OUT</button>
          </div>

          <div class="row" style="margin-top:10px;">
            <button id="sacBtn" class="btn toggle">SAC: OFF</button>
            <button id="clearBtn" class="btn ghost">Clear</button>
          </div>

          <p id="selectedMsg" class="hint" style="display:none;">✓ Selected</p>
        </div>

        <div class="block">
          <h3>Adjust This PA</h3>

          <div class="picker">
            <div class="picker-label">RBI</div>
            <div id="rbiPicker" class="seg"></div>
          </div>

          <div class="picker">
            <div class="picker-label">WHO SCORED?</div>
            <div id="scorersList" class="scorers-list"></div>
          </div>

          <div class="row" style="margin-top:12px;">
            <button id="prevBatterBtn" class="btn ghost">← Previous</button>
            <button id="nextBatterBtn" class="btn primary">Next Batter →</button>
          </div>
          <div class="row" style="margin-top:8px;">
            <button id="finalBtn" class="btn danger">Finalize Game</button>
          </div>

          <p class="muted">Select result, adjust RBI/SAC, mark who scored, then tap Next Batter.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
  <script src="./stats.js"></script>
  <script>
    const gameId = App.getCurrentGameId();
    const game = App.getGame(gameId);
    if (!game) window.location.href = "./index.html";

    document.getElementById("gameTitle").textContent =
      `${game.date || ""} vs ${game.opponent || "Opponent"}` + (game.location ? ` • ${game.location}` : "");

    let sacOn = false;
    let currentResult = null;
    let currentRBI = 0;
    let scorerIds = [];

    // Track the current PA event ID (the one we're editing/creating)
    let currentPAEventId = null;
    
    // Ordered list of all PA event IDs in chronological order
    let paHistory = [];

    function loadPAHistory(){
      // Get all events for this game in chronological order
      const events = App.getEvents()
        .filter(e => e.gameId === gameId)
        .sort((a,b)=> (a.ts||0)-(b.ts||0));
      
      paHistory = events.map(e => e.id);
    }

    function getCurrentPAIndex(){
      // Get current batter position from game state
      const st = App.getGameState(gameId);
      return st.paIndex || 0;
    }

    function setCurrentPAIndex(idx){
      App.setGameState(gameId, { paIndex: idx });
    }

    function makeSeg(elId, onPick){
      const el = document.getElementById(elId);
      el.innerHTML = "";
      for (let i=0;i<=4;i++){
        const b = document.createElement("button");
        b.className = "seg-btn";
        b.textContent = String(i);
        b.dataset.val = String(i);
        b.addEventListener("click", () => onPick(i));
        el.appendChild(b);
      }
    }

    function setSegValue(elId, val){
      document.getElementById(elId).querySelectorAll(".seg-btn").forEach(b=>{
        b.classList.toggle("active", Number(b.dataset.val) === val);
      });
    }

    function showSelected(){
      const m = document.getElementById("selectedMsg");
      m.style.display = "block";
      clearTimeout(showSelected._t);
      showSelected._t = setTimeout(()=> m.style.display="none", 700);
    }

    function getCurrentBatter(){
      const lineup = App.getLineup(gameId);
      if(!lineup.length) return { lineup, idx: 0, playerId: null };
      
      const paIndex = getCurrentPAIndex();
      const lineupIdx = paIndex % lineup.length;
      
      return { 
        lineup, 
        idx: lineupIdx, 
        playerId: lineup[lineupIdx],
        paNumber: Math.floor(paIndex / lineup.length) + 1
      };
    }

    function renderScorersList(){
      const lineup = App.getLineup(gameId);
      const wrap = document.getElementById("scorersList");
      wrap.innerHTML = "";

      lineup.forEach(playerId => {
        const p = App.getPlayer(playerId);
        const label = document.createElement("label");
        label.className = "scorer-checkbox";
        const isChecked = scorerIds.includes(playerId);
        label.innerHTML = `
          <input type="checkbox" data-player="${playerId}" ${isChecked ? 'checked' : ''} />
          <span>${App.escapeHtml(p?.name || "Unknown")}</span>
        `;
        label.querySelector('input').addEventListener('change', updateScorers);
        wrap.appendChild(label);
      });
    }

    function updateScorers(){
      const checked = document.querySelectorAll("#scorersList input:checked");
      scorerIds = Array.from(checked).map(cb => cb.dataset.player);
    }

    function renderBatter(){
      const { lineup, idx, playerId, paNumber } = getCurrentBatter();
      const p = App.getPlayer(playerId);
      document.getElementById("batterName").textContent = p?.name || "Unknown";
      document.getElementById("batterSpot").textContent = `Spot: ${idx+1} • PA #${paNumber}`;
      
      renderScorersList();
      loadCurrentPA();
    }

    function loadCurrentPA(){
      const paIndex = getCurrentPAIndex();
      const eventId = paHistory[paIndex];
      
      if(!eventId){
        // No event exists yet for this PA - clear selection
        clearSelection();
        currentPAEventId = null;
        return;
      }

      const ev = App.getEvent(eventId);
      if(!ev){
        clearSelection();
        currentPAEventId = null;
        return;
      }

      // Load the saved PA
      currentResult = ev.result;
      currentRBI = ev.rbi || 0;
      sacOn = ev.sac || false;
      scorerIds = [];
      currentPAEventId = eventId;

      highlightResult(currentResult);
      setSegValue("rbiPicker", currentRBI);
      renderSac();
      renderScorersList();
    }

    function clearSelection(){
      currentResult = null;
      currentRBI = 0;
      sacOn = false;
      scorerIds = [];
      
      document.querySelectorAll(".big").forEach(b => b.classList.remove("selected"));
      setSegValue("rbiPicker", 0);
      renderSac();
      renderScorersList();
    }

    function highlightResult(res){
      document.querySelectorAll(".big").forEach(b => {
        b.classList.toggle("selected", b.dataset.res === res);
      });
    }

    function renderSac(){
      document.getElementById("sacBtn").textContent = sacOn ? "SAC: ON" : "SAC: OFF";
      document.getElementById("sacBtn").classList.toggle("on", sacOn);
    }

    makeSeg("rbiPicker", (v)=>{
      currentRBI = v;
      setSegValue("rbiPicker", v);
    });

    document.querySelectorAll("[data-res]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        currentResult = btn.dataset.res;
        highlightResult(currentResult);
        showSelected();
      });
    });

    document.getElementById("sacBtn").addEventListener("click", ()=>{
      sacOn = !sacOn;
      renderSac();
    });

    document.getElementById("clearBtn").addEventListener("click", ()=>{
      clearSelection();
    });

    document.getElementById("nextBatterBtn").addEventListener("click", ()=>{
      if(!currentResult){
        alert("Please select a result first.");
        return;
      }

      const { playerId } = getCurrentBatter();
      
      if(!playerId){
        alert("Lineup is empty. Go back to Lineup.");
        return;
      }

      // Update runs for each scorer
      const allEvents = App.getEvents();
      scorerIds.forEach(scorerId => {
        const playerEvents = allEvents
          .filter(e => e.gameId === gameId && e.playerId === scorerId)
          .sort((a,b)=>(b.ts||0)-(a.ts||0));
        if(playerEvents.length > 0){
          const latestEvent = playerEvents[0];
          App.updateEvent(latestEvent.id, { runs: (latestEvent.runs || 0) + 1 });
        }
      });

      // Save or update current PA
      if(currentPAEventId){
        // Update existing event
        App.updateEvent(currentPAEventId, {
          result: currentResult,
          outType: currentResult === "K" ? "K" : null,
          sac: sacOn && currentResult === "OUT",
          rbi: currentRBI,
          runs: 0
        });
      } else {
        // Create new event
        const ev = App.addEvent({
          gameId,
          playerId,
          result: currentResult,
          outType: currentResult === "K" ? "K" : null,
          sac: sacOn && currentResult === "OUT",
          rbi: currentRBI,
          runs: 0
        });
        
        // Add to history
        const paIndex = getCurrentPAIndex();
        paHistory[paIndex] = ev.id;
      }

      // Advance to next PA
      const nextPAIndex = getCurrentPAIndex() + 1;
      setCurrentPAIndex(nextPAIndex);
      
      clearSelection();
      renderBatter();
    });

    document.getElementById("prevBatterBtn").addEventListener("click", ()=>{
      const paIndex = getCurrentPAIndex();
      if(paIndex <= 0) return; // Can't go before first PA
      
      setCurrentPAIndex(paIndex - 1);
      clearSelection();
      renderBatter();
    });

    document.getElementById("finalBtn").addEventListener("click", ()=>{
      App.finalizeGame(gameId);
      alert("Game finalized. You can still view it in reports.");
      window.location.href = "./reports.html";
    });

    // Initialize
    App.initGameState(gameId);
    loadPAHistory();
    renderSac();
    renderBatter();
  </script>
</body>
</html>
