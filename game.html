<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="win=device-width, initial-scale=1.0" />
  <title>Game Logger</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎮 Game Logger</h1>
    <nav class="topnav">
      <a href="./lineup.html">Lineup</a>
      <a href="./reports.html">Reports</a>
      <a href="./index.html">Home</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="gameTitle"></h2>

      <div class="now-batting">
        <div class="label">Now Batting</div>
        <div id="batterName" class="batter"></div>
        <div id="batterSpot" class="muted"></div>
      </div>

      <div class="grid">
        <div class="block">
          <h3>Result</h3>
          <div class="btn-grid">
            <button class="big" data-res="1B">1B</button>
            <button class="big" data-res="2B">2B</button>
            <button class="big" data-res="3B">3B</button>
            <button class="big" data-res="HR">HR</button>
            <button class="big" data-res="BB">BB</button>
            <button class="big" data-res="K">K</button>
            <button class="big" data-res="OUT">OUT</button>
          </div>

          <div class="row" style="margin-top:10px;">
            <button id="sacBtn" class="btn toggle">SAC: OFF</button>
            <button id="clearBtn" class="btn ghost">Clear</button>
          </div>

          <p id="selectedMsg" class="hint" style="display:none;">✓ Selected</p>
        </div>

        <div class="block">
          <h3>Adjust This PA</h3>

          <div class="picker">
            <div class="picker-label">RBI</div>
            <div id="rbiPicker" class="seg"></div>
          </div>

          <div class="picker">
            <div class="picker-label">RUNS</div>
            <div id="runsPicker" class="seg"></div>
          </div>

          <div class="row" style="margin-top:12px;">
            <button id="prevBatterBtn" class="btn ghost">← Previous</button>
            <button id="nextBatterBtn" class="btn primary">Next Batter →</button>
          </div>
          <div class="row" style="margin-top:8px;">
            <button id="finalBtn" class="btn danger">Finalize Game</button>
          </div>

          <p class="muted">Select result, adjust RBI/RUNS/SAC, then tap Next Batter to save.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
  <script src="./stats.js"></script>
  <script>
    const gameId = App.getCurrentGameId();
    const game = App.getGame(gameId);
    if (!game) window.location.href = "./index.html";

    document.getElementById("gameTitle").textContent =
      `${game.date || ""} vs ${game.opponent || "Opponent"}` + (game.location ? ` • ${game.location}` : "");

    let sacOn = false;
    let currentResult = null;  // tracks selected result (not saved yet)
    let currentRBI = 0;
    let currentRUNS = 0;

    // map batter index -> event ID for previously saved PAs
    let batterEventMap = {};

    function loadBatterEventMap(){
      batterEventMap = {};
      const lineup = App.getLineup(gameId);
      const events = App.getEvents().filter(e => e.gameId === gameId);
      
      // Build a map: for each batter position, store the most recent event ID
      // We'll use a simple approach: group events by playerId, then associate with lineup index
      lineup.forEach((playerId, idx) => {
        const playerEvents = events.filter(e => e.playerId === playerId);
        if(playerEvents.length > 0){
          // Get the most recent event for this player in this game
          const sorted = playerEvents.sort((a,b)=> (b.ts||0)-(a.ts||0));
          batterEventMap[idx] = sorted[0].id;
        }
      });
    }

    function makeSeg(elId, onPick){
      const el = document.getElementById(elId);
      el.innerHTML = "";
      for (let i=0;i<=4;i++){
        const b = document.createElement("button");
        b.className = "seg-btn";
        b.textContent = String(i);
        b.dataset.val = String(i);
        b.addEventListener("click", () => onPick(i));
        el.appendChild(b);
      }
    }

    function setSegValue(elId, val){
      document.getElementById(elId).querySelectorAll(".seg-btn").forEach(b=>{
        b.classList.toggle("active", Number(b.dataset.val) === val);
      });
    }

    function showSelected(){
      const m = document.getElementById("selectedMsg");
      m.style.display = "block";
      clearTimeout(showSelected._t);
      showSelected._t = setTimeout(()=> m.style.display="none", 700);
    }

    function getCurrentBatter(){
      const st = App.getGameState(gameId);
      const lineup = App.getLineup(gameId);
      const idx = Math.max(0, Math.min(st.batterIndex || 0, lineup.length-1));
      return { lineup, idx, playerId: lineup[idx] };
    }

    function renderBatter(){
      const { lineup, idx, playerId } = getCurrentBatter();
      const p = App.getPlayer(playerId);
      document.getElementById("batterName").textContent = p?.name || "Unknown";
      document.getElementById("batterSpot").textContent = `Spot: ${idx+1} of ${lineup.length}`;
      
      // Load any existing event for this batter position
      loadPreviousPA(idx);
    }

    function loadPreviousPA(batterIdx){
      // Check if this batter already has a saved PA
      const eventId = batterEventMap[batterIdx];
      if(!eventId){
        // No previous PA - clear selection
        clearSelection();
        return;
      }

      const ev = App.getEvent(eventId);
      if(!ev){
        clearSelection();
        return;
      }

      // Load the saved PA into current selection
      currentResult = ev.result;
      currentRBI = ev.rbi || 0;
      currentRUNS = ev.runs || 0;
      sacOn = ev.sac || false;

      // Update UI
      highlightResult(currentResult);
      setSegValue("rbiPicker", currentRBI);
      setSegValue("runsPicker", currentRUNS);
      renderSac();
    }

    function clearSelection(){
      currentResult = null;
      currentRBI = 0;
      currentRUNS = 0;
      sacOn = false;
      
      document.querySelectorAll(".big").forEach(b => b.classList.remove("selected"));
      setSegValue("rbiPicker", 0);
      setSegValue("runsPicker", 0);
      renderSac();
    }

    function highlightResult(res){
      document.querySelectorAll(".big").forEach(b => {
        b.classList.toggle("selected", b.dataset.res === res);
      });
    }

    function renderSac(){
      document.getElementById("sacBtn").textContent = sacOn ? "SAC: ON" : "SAC: OFF";
      document.getElementById("sacBtn").classList.toggle("on", sacOn);
    }

    // build pickers
    makeSeg("rbiPicker", (v)=>{
      currentRBI = v;
      setSegValue("rbiPicker", v);
    });
    makeSeg("runsPicker", (v)=>{
      currentRUNS = v;
      setSegValue("runsPicker", v);
    });

    // result buttons: just select (don't save yet)
    document.querySelectorAll("[data-res]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        currentResult = btn.dataset.res;
        highlightResult(currentResult);
        showSelected();
      });
    });

    document.getElementById("sacBtn").addEventListener("click", ()=>{
      sacOn = !sacOn;
      renderSac();
    });

    document.getElementById("clearBtn").addEventListener("click", ()=>{
      clearSelection();
    });

    document.getElementById("nextBatterBtn").addEventListener("click", ()=>{
      const { idx, playerId } = getCurrentBatter();
      
      if(!currentResult){
        alert("Please select a result first.");
        return;
      }

      if(!playerId){
        alert("Lineup is empty. Go back to Lineup.");
        return;
      }

      // Check if there's already a saved PA for this batter
      const existingEventId = batterEventMap[idx];
      
      if(existingEventId){
        // Update existing event
        App.updateEvent(existingEventId, {
          result: currentResult,
          outType: currentResult === "K" ? "K" : null,
          sac: sacOn && currentResult === "OUT",
          rbi: currentRBI,
          runs: currentRUNS
        });
      } else {
        // Create new event
        const ev = App.addEvent({
          gameId,
          playerId,
          result: currentResult,
          outType: currentResult === "K" ? "K" : null,
          sac: sacOn && currentResult === "OUT",
          rbi: currentRBI,
          runs: currentRUNS
        });
        batterEventMap[idx] = ev.id;
      }

      // Advance to next batter
      App.advanceBatter(gameId);
      clearSelection();
      renderBatter();
    });

    document.getElementById("prevBatterBtn").addEventListener("click", ()=>{
      const lineup = App.getLineup(gameId);
      if(!lineup.length) return;
      
      const st = App.getGameState(gameId);
      const currentIdx = st.batterIndex || 0;
      const prevIdx = (currentIdx - 1 + lineup.length) % lineup.length;
      
      App.setGameState(gameId, { batterIndex: prevIdx });
      clearSelection();
      renderBatter();
    });

    document.getElementById("finalBtn").addEventListener("click", ()=>{
      App.finalizeGame(gameId);
      alert("Game finalized. You can still view it in reports.");
      window.location.href = "./reports.html";
    });

    // init state if needed
    App.initGameState(gameId);
    loadBatterEventMap();
    renderSac();
    renderBatter();
  </script>
</body>
</html>
