<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Logger</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎮 Game Logger</h1>
    <nav class="topnav">
      <a href="./lineup.html">Lineup</a>
      <a href="./reports.html">Reports</a>
      <a href="./index.html">Home</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="gameTitle"></h2>

      <div class="now-batting">
        <div class="label">Now Batting</div>
        <div id="batterName" class="batter"></div>
        <div id="batterSpot" class="muted"></div>
      </div>

      <div class="grid">
        <div class="block">
          <h3>Result</h3>
          <div class="btn-grid">
            <button class="big" data-res="1B">1B</button>
            <button class="big" data-res="2B">2B</button>
            <button class="big" data-res="3B">3B</button>
            <button class="big" data-res="HR">HR</button>
            <button class="big" data-res="BB">BB</button>
            <button class="big" data-res="K">K</button>
            <button class="big" data-res="OUT">OUT</button>
          </div>

          <div class="row" style="margin-top:10px;">
            <button id="sacBtn" class="btn toggle">SAC: OFF</button>
            <button id="clearBtn" class="btn ghost">Clear</button>
          </div>

          <p id="selectedMsg" class="hint" style="display:none;">✓ Selected</p>
        </div>

        <div class="block">
          <h3>Adjust This PA</h3>

          <div class="picker">
            <div class="picker-label">RBI</div>
            <div id="rbiPicker" class="seg"></div>
          </div>

          <!-- Base Diagram -->
          <div class="picker">
            <div class="picker-label">BASES</div>
            <div class="base-diamond">
              <div class="base base-2b" data-base="2B" id="base2B" draggable="false">
                <span class="base-label">2B</span>
                <span class="base-runner" id="runner2B" draggable="false"></span>
              </div>
              <div class="base-row">
                <div class="base base-3b" data-base="3B" id="base3B" draggable="false">
                  <span class="base-label">3B</span>
                  <span class="base-runner" id="runner3B" draggable="false"></span>
                </div>
                <div class="base base-1b" data-base="1B" id="base1B" draggable="false">
                  <span class="base-label">1B</span>
                  <span class="base-runner" id="runner1B" draggable="false"></span>
                </div>
              </div>
            </div>
            <p class="muted" style="margin-top:8px; font-size:12px;">Click to add/remove • Drag to move runners</p>
          </div>

          <div class="picker">
            <div class="picker-label">WHO SCORED?</div>
            <div id="scorersList" class="scorers-list"></div>
            <p class="muted" style="margin-top:6px; font-size:12px;" id="scorersHint">Only players on base can score</p>
          </div>

          <div class="row" style="margin-top:12px;">
            <button id="prevBatterBtn" class="btn ghost">← Previous</button>
            <button id="nextBatterBtn" class="btn primary">Next Batter →</button>
          </div>
          <div class="row" style="margin-top:8px;">
            <button id="finalBtn" class="btn danger">Finalize Game</button>
          </div>

          <p class="muted">Select result, adjust bases/RBI, mark who scored, then tap Next Batter.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Base Runner Popup -->
  <div class="modal" id="baseModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="baseModalTitle">Select Runner</h2>
        <button class="modal-close" id="closeBaseModal">✕</button>
      </div>
      <div class="modal-body">
        <div id="baseRunnerList"></div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./stats.js"></script>
  <script>
    const gameId = App.getCurrentGameId();
    const game = App.getGame(gameId);
    if (!game) window.location.href = "./index.html";

    document.getElementById("gameTitle").textContent =
      `${game.date || ""} vs ${game.opponent || "Opponent"}` + (game.location ? ` • ${game.location}` : "");

    let sacOn = false;
    let currentResult = null;
    let currentRBI = 0;
    let scorerIds = [];

    let bases = { "1B": null, "2B": null, "3B": null };
    let selectedBase = null;
    let draggedPlayerId = null;
    let dragSourceBase = null;

    let currentPAEventId = null;
    let paHistory = [];

    function loadPAHistory(){
      const events = App.getEvents()
        .filter(e => e.gameId === gameId)
        .sort((a,b)=> (a.ts||0)-(b.ts||0));
      paHistory = events.map(e => e.id);
    }

    function getCurrentPAIndex(){
      const st = App.getGameState(gameId);
      return st.paIndex || 0;
    }

    function setCurrentPAIndex(idx){
      App.setGameState(gameId, { paIndex: idx });
    }

    function makeSeg(elId, onPick){
      const el = document.getElementById(elId);
      el.innerHTML = "";
      for (let i=0;i<=4;i++){
        const b = document.createElement("button");
        b.className = "seg-btn";
        b.textContent = String(i);
        b.dataset.val = String(i);
        b.addEventListener("click", () => onPick(i));
        el.appendChild(b);
      }
    }

    function setSegValue(elId, val){
      document.getElementById(elId).querySelectorAll(".seg-btn").forEach(b=>{
        b.classList.toggle("active", Number(b.dataset.val) === val);
      });
    }

    function showSelected(){
      const m = document.getElementById("selectedMsg");
      m.style.display = "block";
      clearTimeout(showSelected._t);
      showSelected._t = setTimeout(()=> m.style.display="none", 700);
    }

    function getCurrentBatter(){
      const lineup = App.getLineup(gameId);
      if(!lineup.length) return { lineup, idx: 0, playerId: null };
      
      const paIndex = getCurrentPAIndex();
      const lineupIdx = paIndex % lineup.length;
      
      return { 
        lineup, 
        idx: lineupIdx, 
        playerId: lineup[lineupIdx],
        paNumber: Math.floor(paIndex / lineup.length) + 1
      };
    }

    function renderBases(){
      ["1B", "2B", "3B"].forEach(base => {
        const playerId = bases[base];
        const runnerEl = document.getElementById(`runner${base}`);
        const baseEl = document.getElementById(`base${base}`);
        
        if(playerId){
          const p = App.getPlayer(playerId);
          runnerEl.textContent = (p?.name || "?").substring(0, 8);
          baseEl.classList.add("occupied");
          runnerEl.draggable = true;
          runnerEl.dataset.playerId = playerId;
          runnerEl.dataset.base = base;
        } else {
          runnerEl.textContent = "";
          baseEl.classList.remove("occupied");
          runnerEl.draggable = false;
          delete runnerEl.dataset.playerId;
          delete runnerEl.dataset.base;
        }
      });
    }

    function advanceRunners(result){
      const { playerId } = getCurrentBatter();
      let scored = [];

      if(result === "1B"){
        // Single: advance all 1 base
        if(bases["3B"]) scored.push(bases["3B"]);
        bases["3B"] = bases["2B"];
        bases["2B"] = bases["1B"];
        bases["1B"] = playerId;
      } else if(result === "2B"){
        // Double: advance all 2 bases
        if(bases["3B"]) scored.push(bases["3B"]);
        if(bases["2B"]) scored.push(bases["2B"]);
        bases["3B"] = bases["1B"];
        bases["2B"] = playerId;
        bases["1B"] = null;
      } else if(result === "3B"){
        // Triple: everyone scores
        if(bases["1B"]) scored.push(bases["1B"]);
        if(bases["2B"]) scored.push(bases["2B"]);
        if(bases["3B"]) scored.push(bases["3B"]);
        bases["3B"] = playerId;
        bases["2B"] = null;
        bases["1B"] = null;
      } else if(result === "HR"){
        // Home run: everyone scores including batter
        if(bases["1B"]) scored.push(bases["1B"]);
        if(bases["2B"]) scored.push(bases["2B"]);
        if(bases["3B"]) scored.push(bases["3B"]);
        scored.push(playerId);
        bases["1B"] = null;
        bases["2B"] = null;
        bases["3B"] = null;
      } else if(result === "BB"){
        // Walk: force advancement logic
        const has1B = !!bases["1B"];
        const has2B = !!bases["2B"];
        const has3B = !!bases["3B"];

        if(has1B && has2B && has3B){
          // Bases loaded: force home
          scored.push(bases["3B"]);
          bases["3B"] = bases["2B"];
          bases["2B"] = bases["1B"];
          bases["1B"] = playerId;
        } else if(has1B && has2B && !has3B){
          // 1B + 2B: force to 3B
          bases["3B"] = bases["2B"];
          bases["2B"] = bases["1B"];
          bases["1B"] = playerId;
        } else if(has1B && !has2B){
          // Only 1B: force to 2B
          bases["2B"] = bases["1B"];
          bases["1B"] = playerId;
        } else {
          // No force (2B only, 3B only, 2B+3B, or empty)
          bases["1B"] = playerId;
        }
      }

      // Auto-check scored runners
      scored.forEach(id => {
        if(!scorerIds.includes(id)) scorerIds.push(id);
      });

      renderBases();
      renderScorersList();
    }

    // Drag and drop
    document.addEventListener("dragstart", (e)=>{
      if(e.target.classList.contains("base-runner") && e.target.dataset.playerId){
        draggedPlayerId = e.target.dataset.playerId;
        dragSourceBase = e.target.dataset.base;
        e.target.style.opacity = "0.5";
      }
    });

    document.addEventListener("dragend", (e)=>{
      if(e.target.classList.contains("base-runner")){
        e.target.style.opacity = "1";
        draggedPlayerId = null;
        dragSourceBase = null;
      }
    });

    document.querySelectorAll(".base").forEach(baseEl => {
      baseEl.addEventListener("dragover", (e)=>{
        e.preventDefault();
      });

      baseEl.addEventListener("drop", (e)=>{
        e.preventDefault();
        if(!draggedPlayerId || !dragSourceBase) return;

        const targetBase = baseEl.dataset.base;
        
        // Move runner from source to target
        if(bases[targetBase]){
          // Swap if target is occupied
          const temp = bases[targetBase];
          bases[targetBase] = draggedPlayerId;
          bases[dragSourceBase] = temp;
        } else {
          // Just move
          bases[targetBase] = draggedPlayerId;
          bases[dragSourceBase] = null;
        }

        renderBases();
      });

      // Click to add/remove (original functionality)
      baseEl.addEventListener("click", (e)=>{
        // Don't trigger if we just finished dragging
        if(e.target.classList.contains("base-runner")) return;
        openBaseModal(baseEl.dataset.base);
      });
    });

    function openBaseModal(base){
      selectedBase = base;
      const currentRunner = bases[base];
      
      if(currentRunner){
        document.getElementById("baseModalTitle").textContent = `${base} - Remove Runner?`;
        const list = document.getElementById("baseRunnerList");
        list.innerHTML = "";
        
        const p = App.getPlayer(currentRunner);
        const removeBtn = document.createElement("button");
        removeBtn.className = "btn danger";
        removeBtn.style.width = "100%";
        removeBtn.textContent = `Remove ${p?.name || "Unknown"}`;
        removeBtn.addEventListener("click", ()=>{
          bases[base] = null;
          closeBaseModal();
          renderBases();
          renderScorersList();
        });
        list.appendChild(removeBtn);
      } else {
        document.getElementById("baseModalTitle").textContent = `${base} - Add Runner`;
        const list = document.getElementById("baseRunnerList");
        list.innerHTML = "";
        
        const lineup = App.getLineup(gameId);
        lineup.forEach(playerId => {
          const p = App.getPlayer(playerId);
          const btn = document.createElement("button");
          btn.className = "list-item";
          btn.style.marginBottom = "6px";
          btn.innerHTML = `<span style="font-weight:700;">${App.escapeHtml(p?.name || "Unknown")}</span>`;
          btn.addEventListener("click", ()=>{
            bases[base] = playerId;
            closeBaseModal();
            renderBases();
            renderScorersList();
          });
          list.appendChild(btn);
        });
      }
      
      document.getElementById("baseModal").classList.add("show");
    }

    function closeBaseModal(){
      document.getElementById("baseModal").classList.remove("show");
      selectedBase = null;
    }

    document.getElementById("closeBaseModal").addEventListener("click", closeBaseModal);
    document.getElementById("baseModal").addEventListener("click", (e)=>{
      if(e.target.id === "baseModal") closeBaseModal();
    });

    function renderScorersList(){
      const wrap = document.getElementById("scorersList");
      wrap.innerHTML = "";

      const runnersOnBase = Object.values(bases).filter(id => id !== null);
      
      if(runnersOnBase.length === 0){
        wrap.innerHTML = '<p class="muted" style="font-size:13px;">No runners on base</p>';
        return;
      }

      runnersOnBase.forEach(playerId => {
        const p = App.getPlayer(playerId);
        const label = document.createElement("label");
        label.className = "scorer-checkbox";
        const isChecked = scorerIds.includes(playerId);
        label.innerHTML = `
          <input type="checkbox" data-player="${playerId}" ${isChecked ? 'checked' : ''} />
          <span>${App.escapeHtml(p?.name || "Unknown")}</span>
        `;
        label.querySelector('input').addEventListener('change', updateScorers);
        wrap.appendChild(label);
      });
    }

    function updateScorers(){
      const checked = document.querySelectorAll("#scorersList input:checked");
      scorerIds = Array.from(checked).map(cb => cb.dataset.player);
      
      // If someone is unchecked, add them back to 3B (user can move them)
      const allRunners = Object.values(bases).filter(id => id !== null);
      allRunners.forEach(runnerId => {
        if(!scorerIds.includes(runnerId)){
          // Check if they're still on base somewhere
          let onBase = false;
          ["1B","2B","3B"].forEach(b => {
            if(bases[b] === runnerId) onBase = true;
          });
          // If not on base, put back on 3B
          if(!onBase && !bases["3B"]){
            bases["3B"] = runnerId;
            renderBases();
          }
        }
      });
    }

    function renderBatter(){
      const { lineup, idx, playerId, paNumber } = getCurrentBatter();
      const p = App.getPlayer(playerId);
      document.getElementById("batterName").textContent = p?.name || "Unknown";
      document.getElementById("batterSpot").textContent = `Spot: ${idx+1} • PA #${paNumber}`;
      
      renderBases();
      renderScorersList();
      loadCurrentPA();
    }

    function loadCurrentPA(){
      const paIndex = getCurrentPAIndex();
      const eventId = paHistory[paIndex];
      
      if(!eventId){
        clearSelection();
        currentPAEventId = null;
        return;
      }

      const ev = App.getEvent(eventId);
      if(!ev){
        clearSelection();
        currentPAEventId = null;
        return;
      }

      currentResult = ev.result;
      currentRBI = ev.rbi || 0;
      sacOn = ev.sac || false;
      scorerIds = [];
      currentPAEventId = eventId;

      highlightResult(currentResult);
      setSegValue("rbiPicker", currentRBI);
      renderSac();
    }

    function clearSelection(){
      currentResult = null;
      currentRBI = 0;
      sacOn = false;
      scorerIds = [];
      
      document.querySelectorAll(".big").forEach(b => b.classList.remove("selected"));
      setSegValue("rbiPicker", 0);
      renderSac();
      renderScorersList();
    }

    function highlightResult(res){
      document.querySelectorAll(".big").forEach(b => {
        b.classList.toggle("selected", b.dataset.res === res);
      });
    }

    function renderSac(){
      document.getElementById("sacBtn").textContent = sacOn ? "SAC: ON" : "SAC: OFF";
      document.getElementById("sacBtn").classList.toggle("on", sacOn);
    }

    makeSeg("rbiPicker", (v)=>{
      currentRBI = v;
      setSegValue("rbiPicker", v);
    });

    document.querySelectorAll("[data-res]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        currentResult = btn.dataset.res;
        highlightResult(currentResult);
        showSelected();
        
        // Auto-advance runners based on result
        if(["1B","2B","3B","HR","BB"].includes(currentResult)){
          advanceRunners(currentResult);
        }
      });
    });

    document.getElementById("sacBtn").addEventListener("click", ()=>{
      sacOn = !sacOn;
      renderSac();
    });

    document.getElementById("clearBtn").addEventListener("click", ()=>{
      clearSelection();
    });

    document.getElementById("nextBatterBtn").addEventListener("click", ()=>{
      if(!currentResult){
        alert("Please select a result first.");
        return;
      }

      const { playerId } = getCurrentBatter();
      
      if(!playerId){
        alert("Lineup is empty. Go back to Lineup.");
        return;
      }

      // Update runs for each scorer
      const allEvents = App.getEvents();
      scorerIds.forEach(scorerId => {
        const playerEvents = allEvents
          .filter(e => e.gameId === gameId && e.playerId === scorerId)
          .sort((a,b)=>(b.ts||0)-(a.ts||0));
        if(playerEvents.length > 0){
          const latestEvent = playerEvents[0];
          App.updateEvent(latestEvent.id, { runs: (latestEvent.runs || 0) + 1 });
        }
        
        // Remove scorer from bases
        ["1B", "2B", "3B"].forEach(base => {
          if(bases[base] === scorerId) bases[base] = null;
        });
      });

      // Save or update current PA
      if(currentPAEventId){
        App.updateEvent(currentPAEventId, {
          result: currentResult,
          outType: currentResult === "K" ? "K" : null,
          sac: sacOn && currentResult === "OUT",
          rbi: currentRBI,
          runs: 0
        });
      } else {
        const ev = App.addEvent({
          gameId,
          playerId,
          result: currentResult,
          outType: currentResult === "K" ? "K" : null,
          sac: sacOn && currentResult === "OUT",
          rbi: currentRBI,
          runs: 0
        });
        
        const paIndex = getCurrentPAIndex();
        paHistory[paIndex] = ev.id;
      }

      const nextPAIndex = getCurrentPAIndex() + 1;
      setCurrentPAIndex(nextPAIndex);
      
      clearSelection();
      renderBatter();
    });

    document.getElementById("prevBatterBtn").addEventListener("click", ()=>{
      const paIndex = getCurrentPAIndex();
      if(paIndex <= 0) return;
      
      setCurrentPAIndex(paIndex - 1);
      clearSelection();
      renderBatter();
    });

    document.getElementById("finalBtn").addEventListener("click", ()=>{
      App.finalizeGame(gameId);
      alert("Game finalized. You can still view it in reports.");
      window.location.href = "./reports.html";
    });

    App.initGameState(gameId);
    loadPAHistory();
    renderSac();
    renderBatter();
  </script>
</body>
</html>
